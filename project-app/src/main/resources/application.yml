spring:
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://project-db:5432/project
    username: admin
    password: qwerty
    hikari:
      maximum-pool-size: 5
      connection-timeout: 15001
      idle-timeout: 18000001
      max-life-time: 18000001
  jpa:
    database: default
    open-in-view: false
    properties:
      hibernate:
        enable_lazy_load_no_trans: false
        default_schema: db_notification
        dialect: org.hibernate.dialect.PostgreSQLDialect
        properties.hibernate.temp.use_jdbc_metadata_defaults: false
        jdbc:
          lob:
            non_contextual_creation: true

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,env